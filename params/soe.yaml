# 国企采购合规包参数：定义与示例默认值（见 docs/packs/soe-procurement.md §6）。
# 以下为示例，实施时按企业制度和授权文件赋值。字段含义见 core.yaml 文件头。
# 公开招标金额标准、最少参与供应商数、评审小组人数是通用概念，定义在 core.yaml
#（open_tender_threshold、min_bidders、panel_min_size），本包的规则表直接引用。

so_publicity_days:
  label: 结果公示期
  unit: 日历日
  example: 3
  used_in: [SO-03]
  system: 公示记录的截止时间计算

so_objection_reply_days:
  label: 异议答复时限
  unit: 工作日（收到异议后）
  example: 3
  used_in: [SO-04]
  system: 异议记录的答复期限与超时提醒

so_collective_decision_rule:
  label: 集体决策的金额标准
  example: 按企业「三重一大」制度规定
  used_in: [SO-01]
  system: 采购方案的集体决策触发条件
