# Older pnpm needs this key; empty because this project is not a monorepo.
packages: []

# Build-script approvals for pnpm 10.0–10.25, which do not read allowBuilds.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

# The same approvals for pnpm 10.26 and later; pnpm 11 reads only this key.
allowBuilds:
  better-sqlite3: true
  esbuild: true

# Upstream peer ranges measured harmless; this only silences the warning.
peerDependencyRules:
  allowedVersions:
    'better-auth>better-sqlite3': '13'
    '@better-auth/core>@better-auth/utils': '0.5.0'
    '@better-auth/oauth-provider>@better-auth/utils': '0.5.0'
    '@better-auth/scim>@better-auth/utils': '0.5.0'
    '@better-auth/sso>@better-auth/utils': '0.5.0'

# The CLI depends on these by range; hold them at the version package.json pins (18.1 upgrade checklist).
# Move them together with the @objectstack/* pins at every upgrade.
overrides:
  '@objectstack/core': '18.1.0'
  '@objectstack/driver-memory': '18.1.0'
  '@objectstack/driver-mongodb': '18.1.0'
  '@objectstack/driver-sql': '18.1.0'
  '@objectstack/driver-sqlite-wasm': '18.1.0'
  '@objectstack/objectql': '18.1.0'
  '@objectstack/observability': '18.1.0'
  '@objectstack/runtime': '18.1.0'
